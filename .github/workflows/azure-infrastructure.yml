name: Azure infrastructure preview and manual apply

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Create/update BILLABLE resources after reviewing preview and approving the apply job'
        type: boolean
        required: true
        default: false
      adopt_existing:
        description: 'Adopt existing owned site/storage/service parents without root PUTs (disable only for full provisioning)'
        type: boolean
        required: true
        default: true
      replace_app_settings:
        description: 'Approve authoritative replacement of the four documented app settings; ARM cannot diff this endpoint (no GET)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: azure-production-lifecycle
  cancel-in-progress: false

# Both jobs intentionally use the SAME GitHub environment configuration. If
# required reviewers are enabled, preview also needs approval. GitHub environment
# protection rules MUST be configured manually; this YAML cannot create them.
env:
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
  STORAGE_LOCATION: ${{ vars.STORAGE_LOCATION }}
  STATIC_WEB_APP_NAME: ${{ vars.STATIC_WEB_APP_NAME }}
  STORAGE_ACCOUNT_NAME: ${{ vars.STORAGE_ACCOUNT_NAME }}
  ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
  ENTRA_OIDC_DISCOVERY_URL: ${{ vars.ENTRA_OIDC_DISCOVERY_URL }}
  ADOPT_EXISTING: ${{ inputs.adopt_existing }}

jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-infrastructure
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
      - name: Validate and snapshot nonsecret parameters
        run: node infra/scripts/prepare-parameters.mjs snapshot infra-plan
        env:
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
          APPROVED_USERS_JSON: ${{ secrets.APPROVED_USERS_JSON }}
          STORAGE_CONNECTION_STRING: ${{ secrets.STORAGE_CONNECTION_STRING }}
      - name: Compile immutable deployment artifact
        run: |
          az bicep build --file infra/main.bicep --outfile infra-plan/main.json
          node infra/scripts/deployment-preview.mjs parameters infra-plan
          if [ "$ADOPT_EXISTING" = "true" ]; then
            az bicep build --file infra/data.bicep --outfile infra-plan/resources.json
          else
            az bicep build --file infra/resources.bicep --outfile infra-plan/resources.json
          fi
      - uses: azure/login@v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify owned inventory and existing security baseline
        run: node infra/scripts/deployment-preview.mjs inventory infra-plan
      - name: Detailed public resource preview and secret-safe settings review
        env:
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
          APPROVED_USERS_JSON: ${{ secrets.APPROVED_USERS_JSON }}
          STORAGE_CONNECTION_STRING: ${{ secrets.STORAGE_CONNECTION_STRING }}
          FULL_WHAT_IF_FILE: ${{ runner.temp }}/infra-whatif.json
          RESOURCE_WHAT_IF_FILE: ${{ runner.temp }}/resources-whatif.json
        run: |
          set -euo pipefail
          parameters="$RUNNER_TEMP/infra-parameters.json"
          umask 077
          trap 'rm -f "$parameters" "$FULL_WHAT_IF_FILE" "$RESOURCE_WHAT_IF_FILE"' EXIT
          node infra/scripts/prepare-parameters.mjs secure "$parameters"
          az group show --name "$RESOURCE_GROUP" --subscription "$AZURE_SUBSCRIPTION_ID" --output none
          az deployment group what-if --resource-group "$RESOURCE_GROUP" --subscription "$AZURE_SUBSCRIPTION_ID" \
            --name "resources-${GITHUB_RUN_ID}" --template-file infra-plan/resources.json \
            --parameters @infra-plan/resource-parameters.json --mode Incremental \
            --result-format FullResourcePayloads --no-pretty-print --output json > "$RESOURCE_WHAT_IF_FILE"
          az deployment group validate --resource-group "$RESOURCE_GROUP" --subscription "$AZURE_SUBSCRIPTION_ID" \
            --template-file infra-plan/main.json --parameters "@$parameters" --output none
          az deployment group what-if --resource-group "$RESOURCE_GROUP" --subscription "$AZURE_SUBSCRIPTION_ID" \
            --name "bball-${GITHUB_RUN_ID}" --template-file infra-plan/main.json \
            --parameters "@$parameters" --mode Incremental --result-format ResourceIdOnly --no-pretty-print --output json > "$FULL_WHAT_IF_FILE"
          node infra/scripts/deployment-preview.mjs review infra-plan
      - name: Retain reviewed template and nonsecret parameters (never secrets)
        uses: actions/upload-artifact@v4.6.2
        with:
          name: infrastructure-plan
          path: infra-plan/
          retention-days: 3
          if-no-files-found: error

  production-infrastructure:
    if: inputs.apply == true && inputs.replace_app_settings == true && github.ref == 'refs/heads/main'
    needs: preview
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production-infrastructure
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4.3.0
        with:
          name: infrastructure-plan
          path: infra-plan
      - uses: azure/login@v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Apply exactly the compiled preview artifact, not rebuilt Bicep
        env:
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
          APPROVED_USERS_JSON: ${{ secrets.APPROVED_USERS_JSON }}
          STORAGE_CONNECTION_STRING: ${{ secrets.STORAGE_CONNECTION_STRING }}
        run: |
          set -euo pipefail
          parameters="$RUNNER_TEMP/infra-parameters.json"
          trap 'rm -f "$parameters"' EXIT
          node infra/scripts/prepare-parameters.mjs secure "$parameters"
          node infra/scripts/deployment-preview.mjs recheck infra-plan
          az group show --name "$RESOURCE_GROUP" --subscription "$AZURE_SUBSCRIPTION_ID" --output none
          az deployment group create --resource-group "$RESOURCE_GROUP" --subscription "$AZURE_SUBSCRIPTION_ID" \
            --name "bball-${GITHUB_RUN_ID}" --template-file infra-plan/main.json \
            --parameters "@$parameters" --mode Incremental --output none