openapi: 3.1.0
info:
  title: Basketball statistics API
  version: 0.1.0
  description: |
    Initial master-only session framework. No contributor invitations, membership
    routes, whole-state writes, realtime sync, imports or client role overrides.
    Deploy ONLY as Azure Static Web Apps managed Functions behind the trusted SWA
    proxy. authLevel anonymous is intentional: application auth validates the
    proxy-injected x-ms-client-principal and its authenticated role against
    APPROVED_USERS_JSON. An independently public Functions deployment is UNSAFE;
    this base64 principal is not a signed token. Local development must use SWA
    emulator principals with the same approved stable IDs; no auth bypass exists.
    Configure APPROVED_USERS_JSON as an array of {id,name,role}, roles user or
    administrator, and STORAGE_CONNECTION_STRING server-side only. Storage tables
    CompetitionData and SessionOperations and PRIVATE container game-sessions must
    already exist. This API does not provision resources or set container access.
    Node 22, Functions runtime v4. Request JSON must be under 48 KiB UTF-8; operation
    JSON must additionally be under 48 KiB UTF-16. Unknown properties are rejected.
    API responses are no-store. Errors never include storage configuration.
    Metadata changes require explicit If-Match (not wildcard); concurrent Table
    transactions may return 409 even after matching the supplied metadata ETag.
    Subscriptions are logically revoked using conditional updates. Competition and
    game DELETE archives, rather than physically deleting saved-session history.
    Existing master sessions remain available after archive if still subscribed
    (or site admin); creation is blocked. Subscription revocation removes access.
    Head and initialization/operation log insert commit atomically in one session
    partition. Dedup checks precede expectedRevision validation. Operation ID reuse
    with different input is 409; entity IDs, including deleted/undone IDs, cannot be
    reused. Snapshot reads replay all committed operations; Blob is only an optional
    monotonic ETag checkpoint, never the source of truth. Failed checkpoint uploads
    do not invalidate successful log commits. Clock-running state is preserved;
    clients must stop it with an acknowledged context operation when resuming.
servers:
  - url: /api
security:
  - swaCookie: []
paths:
  /v1/health:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: Liveness only; no configuration or storage availability check
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties: { status: { const: ok } }
  /v1/me:
    get:
      operationId: currentAccount
      responses:
        '200':
          description: Approved profile; role and name come from server configuration
          content: { application/json: { schema: { $ref: '#/components/schemas/LocalAccount' } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/users:
    get:
      operationId: approvedUsers
      description: Administrator only. Returns configured approved accounts, not arbitrary provider users.
      responses:
        '200':
          description: Approved accounts
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LocalAccount' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/competitions:
    get:
      operationId: listCompetitions
      description: Approved accounts may discover active competitions. Ordinary users see only their own subscriber ID; administrators see approved subscribed IDs.
      responses:
        '200':
          description: Active competitions
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Competition' } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createCompetition
      description: Administrator only; server generates ID.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CompetitionInput' } } }
      responses:
        '201':
          description: Created competition
          content: { application/json: { schema: { $ref: '#/components/schemas/Competition' } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/competitions/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }]
    patch:
      operationId: renameCompetition
      description: Administrator only.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CompetitionInput' } } }
      responses:
        '200':
          description: Renamed competition and new ETag
          content: { application/json: { schema: { $ref: '#/components/schemas/Competition' } } }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: archiveCompetition
      description: Administrator only; subscriptions and sessions retained.
      responses:
        '200':
          description: Archived competition and new ETag
          content: { application/json: { schema: { $ref: '#/components/schemas/Competition' } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/competitions/{id}/games:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: listGames
      description: Subscriber or administrator; active competition only.
      responses:
        '200':
          description: Active scheduled games
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ScheduledGame' } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createGame
      description: Administrator only. Parent competition ETag participates internally in atomic create.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GameInput' } } }
      responses:
        '201':
          description: Created scheduled game
          content: { application/json: { schema: { $ref: '#/components/schemas/ScheduledGame' } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/games/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }]
    patch:
      operationId: updateGame
      description: Administrator only. ID and competitionId cannot change.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GamePatch' } } }
      responses:
        '200':
          description: Updated game and ETag
          content: { application/json: { schema: { $ref: '#/components/schemas/ScheduledGame' } } }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: archiveGame
      description: Administrator only; saved sessions retained.
      responses:
        '200':
          description: Archived game and ETag
          content: { application/json: { schema: { $ref: '#/components/schemas/ScheduledGame' } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/competitions/{id}/subscriptions/{userId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - name: userId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 256 }
    put:
      operationId: subscribe
      description: Self or administrator; approved target only; archived competition rejects additions. No request body. Repeating an existing subscription is a no-op.
      responses:
        '204': { description: Subscribed }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: unsubscribe
      description: Self or administrator; approved target only. Allowed on archives; no request body. Revocation is a conditional soft delete; repeating removal is a no-op.
      responses:
        '204': { description: Unsubscribed }
        default: { $ref: '#/components/responses/Error' }
  /v1/me/preferences:
    get:
      operationId: getPreferences
      responses:
        '200':
          description: Own defaults; empty roster and enabled statistics with null ETag before first write
          content: { application/json: { schema: { $ref: '#/components/schemas/Preferences' } } }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: putPreferences
      description: Full preference replacement, not session state. Existing row needs explicit If-Match; first write needs If-None-Match '*'. No automatic roster application to sessions.
      parameters:
        - name: If-Match
          in: header
          schema: { type: string }
        - name: If-None-Match
          in: header
          schema: { const: '*' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PreferencesInput' } } }
      responses:
        '200':
          description: Saved preferences and ETag
          content: { application/json: { schema: { $ref: '#/components/schemas/Preferences' } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/games/{id}/sessions:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: listOwnSessions
      description: Subscriber or administrator; returns only caller's master sessions, including archived game/competition history. No contributor memberships exist yet. Administrators do not see other users' sessions.
      responses:
        '200':
          description: Own session metadata sorted newest first
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SessionMetadata' } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createSession
      description: Subscriber or administrator; active game and competition required. Server creator is sole master. Idempotency is scoped to actor/game/operationId. Initialization stores safe empty roster, false started/running flags and scheduled details atomically with revision-zero head/log. Returns metadata, not state; fetch snapshot to load. Retry returns current metadata of the same session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operationId]
              properties: { operationId: { type: string, format: uuid } }
      responses:
        '201':
          description: Created or existing session metadata
          content: { application/json: { schema: { $ref: '#/components/schemas/SessionMetadata' } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/sessions/{id}/snapshot:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: loadSnapshot
      description: Master only, independently of site admin role; subscription or admin competition access still required. Reconstructs exact committed head revision from initialization plus ordered operation log. Never relies on cached Blob, and does not silently modify clockRunning.
      responses:
        '200':
          description: Authoritative loaded session
          content: { application/json: { schema: { $ref: '#/components/schemas/LoadedSession' } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/sessions/{id}/operations:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: commitOperation
      description: |
        Master only, even for site administrators. Future contributor type is
        reserved but grants no access. Expected revision must equal current head,
        except exact committed retry returns its original committed revision.
        Server assigns timestamp/actor/session/revision provenance. New events
        are allowed only on active final possession; historical score/delete/detail
        edits are allowed. possession_end is generated only by possession.toggle.
        Context is a partial replacement of listed fields, never possessions.
        Existing stint identity/start/quarter/lineup and substitutions cannot be
        rewritten; append new stints/substitutions and close prior stint endClock.
        Team players must be on-court; assists use the score's attributed lineup,
        cannot self-assist, and generate a deterministic linked assist event.
        Totals and linkage are recomputed/validated; removing score removes linked
        assist, removing linked assist resets score status to unknown. Provided
        entity IDs must be unique for the session lifetime; toggle consumes both
        provided IDs even if undo removes an empty boundary. Toggle validates latest
        stint and on-court lineup then mirrors existing empty-possession undo rules.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OperationInput' } } }
      responses:
        '200':
          description: Committed revision (state is intentionally omitted); a dedup retry may return an older committed revision than current head
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [revision]
                properties: { revision: { type: integer, minimum: 1 } }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    swaCookie:
      type: apiKey
      in: cookie
      name: StaticWebAppsAuthCookie
      description: Browser authenticates to SWA. SWA proxy injects the trusted principal header; clients must not supply it directly.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Exact returned ETag, not '*'. Missing/wildcard is 428, stale value is 412.
      schema: { type: string, minLength: 1 }
  responses:
    Error:
      description: 400 invalid JSON/schema/invariant; 401 absent/invalid principal; 403 approval/role/master/subscription failure; 404 unavailable resource/route; 409 stale revision/id reuse/archive/transaction conflict; 412 metadata ETag mismatch; 413 size limit; 415 JSON required; 428 metadata precondition required; 503 missing account/storage configuration; 500 unexpected storage/replay failure.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: array, items: { type: [string, number] } }
                        message: { type: string }
  schemas:
    Id: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
    Clock: { type: string, pattern: '^(?:[0-5][0-9]:[0-5][0-9]|60:00)$' }
    Lineup:
      type: array
      maxItems: 5
      uniqueItems: true
      items: { $ref: '#/components/schemas/Id' }
    LocalAccount:
      type: object
      additionalProperties: false
      required: [id, name, role]
      properties:
        id: { type: string, minLength: 1, maxLength: 256 }
        name: { type: string, minLength: 1, maxLength: 120 }
        role: { enum: [user, administrator] }
    CompetitionInput:
      type: object
      additionalProperties: false
      required: [name]
      properties: { name: { type: string, minLength: 1, maxLength: 200 } }
    Competition:
      type: object
      additionalProperties: false
      required: [id, name, subscriberIds, archived, etag]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, minLength: 1, maxLength: 200 }
        subscriberIds: { type: array, uniqueItems: true, items: { type: string, maxLength: 256 } }
        archived: { type: boolean }
        etag: { type: string }
    GameDetails:
      type: object
      additionalProperties: false
      required: [gameTitle, teamName, opponentName, gameDate, venue, notes]
      properties: &gameDetailsProperties
        gameTitle: { type: string, maxLength: 200 }
        teamName: { type: string, maxLength: 200 }
        opponentName: { type: string, maxLength: 200 }
        gameDate: { type: string, maxLength: 10 }
        venue: { type: string, maxLength: 200 }
        notes: { type: string, maxLength: 2000 }
    GameInput:
      type: object
      additionalProperties: false
      required: [gameTitle, teamName, opponentName, gameDate, gameTime, venue, notes]
      properties: &gameInputProperties
        <<: *gameDetailsProperties
        gameTitle: { type: string, minLength: 1, maxLength: 200 }
        teamName: { type: string, minLength: 1, maxLength: 200 }
        opponentName: { type: string, minLength: 1, maxLength: 200 }
        gameDate: { type: string, format: date }
        gameTime: { type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$' }
    GamePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties: *gameInputProperties
    ScheduledGame:
      type: object
      additionalProperties: false
      required: [id, competitionId, gameTitle, teamName, opponentName, gameDate, gameTime, venue, notes, archived, etag]
      properties:
        <<: *gameInputProperties
        id: { $ref: '#/components/schemas/Id' }
        competitionId: { $ref: '#/components/schemas/Id' }
        archived: { type: boolean }
        etag: { type: string }
    Player:
      type: object
      additionalProperties: false
      required: [id, number, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        number: { type: integer, minimum: 0, maximum: 999 }
        name: { type: string, minLength: 1, maxLength: 120 }
    Roster:
      type: array
      maxItems: 100
      description: Player IDs and jersey numbers unique. Blank/NaN/incomplete roster rows must remain local UI draft state.
      items: { $ref: '#/components/schemas/Player' }
    StatisticSide:
      type: object
      additionalProperties: false
      properties:
        possession_end: { type: boolean }
        pass: { type: boolean }
        paint_touch: { type: boolean }
        assist: { type: boolean }
        offensive_rebound: { type: boolean }
        defensive_rebound: { type: boolean }
        opposition_rebound: { type: boolean }
        opposition_miss: { type: boolean }
        steal: { type: boolean }
        block: { type: boolean }
        shot_made: { type: boolean }
        shot_miss: { type: boolean }
        turnover: { type: boolean }
        foul: { type: boolean }
        opp_score: { type: boolean }
        fast_break: { type: boolean }
    Statistics:
      type: object
      additionalProperties: false
      required: [offense, defense]
      properties:
        offense: { $ref: '#/components/schemas/StatisticSide' }
        defense: { $ref: '#/components/schemas/StatisticSide' }
    PreferencesInput:
      type: object
      additionalProperties: false
      required: [roster, statistics]
      properties: &preferenceProperties
        roster: { $ref: '#/components/schemas/Roster' }
        statistics: { $ref: '#/components/schemas/Statistics' }
    Preferences:
      type: object
      additionalProperties: false
      required: [roster, statistics, etag]
      properties:
        <<: *preferenceProperties
        etag: { type: [string, 'null'] }
    LineupStint:
      type: object
      additionalProperties: false
      required: [id, label, quarter, startClock, endClock, lineupIds]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        label: { type: string, maxLength: 200 }
        quarter: { type: integer, minimum: 1, maximum: 20 }
        startClock: { $ref: '#/components/schemas/Clock' }
        endClock: { $ref: '#/components/schemas/Clock' }
        lineupIds: { $ref: '#/components/schemas/Lineup' }
    Substitution:
      type: object
      additionalProperties: false
      required: [id, quarter, clock, playerOutId, playerInId]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        quarter: { type: integer, minimum: 1, maximum: 20 }
        clock: { $ref: '#/components/schemas/Clock' }
        playerOutId: { $ref: '#/components/schemas/Id' }
        playerInId: { $ref: '#/components/schemas/Id' }
    ContextPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties: &contextProperties
        sessionStarted: { type: boolean }
        gameDetails: { $ref: '#/components/schemas/GameDetails' }
        roster: { $ref: '#/components/schemas/Roster' }
        onCourtLineup: { $ref: '#/components/schemas/Lineup' }
        lineupStints: { type: array, maxItems: 2000, items: { $ref: '#/components/schemas/LineupStint' } }
        startingLineupsByQuarter:
          type: object
          propertyNames: { pattern: '^(?:[1-9]|1[0-9]|20)$' }
          additionalProperties: { $ref: '#/components/schemas/Lineup' }
        substitutions: { type: array, maxItems: 2000, items: { $ref: '#/components/schemas/Substitution' } }
        clockSeconds: { type: integer, minimum: 0, maximum: 3600 }
        clockRunning: { type: boolean }
        currentSide: { enum: [offense, defense] }
        statistics: { $ref: '#/components/schemas/Statistics' }
    SessionState:
      type: object
      additionalProperties: false
      required: [sessionStarted, gameDetails, roster, onCourtLineup, lineupStints, startingLineupsByQuarter, substitutions, clockSeconds, clockRunning, currentSide, statistics, possessions]
      description: Deep schemas plus runtime roster/ID/reference/score/boundary/linkage checks; maximum 20000 total events. Started session needs five on-court players and a matching latest stint; running clock additionally needs positive seconds. Exactly final possession is open; its side equals currentSide.
      properties:
        <<: *contextProperties
        possessions: { type: array, minItems: 1, maxItems: 2000, items: { $ref: '#/components/schemas/Possession' } }
    ScoreAssist:
      oneOf:
        - type: object
          additionalProperties: false
          required: [status]
          properties: { status: { enum: [unknown, not_applicable] } }
        - type: object
          additionalProperties: false
          required: [status, playerId]
          properties:
            status: { const: player }
            playerId: { $ref: '#/components/schemas/Id' }
    EventDraft:
      type: object
      additionalProperties: false
      required: [id, playerId, type, clock]
      description: Points allowed only for shot_made/opp_score, default 2. Empty playerId allowed for opposition events; team events require on-court player. No author/stint/assist/link fields accepted here.
      properties: &eventDraftProperties
        id: { $ref: '#/components/schemas/Id' }
        playerId: { type: string, maxLength: 128, pattern: '^[A-Za-z0-9_-]*$' }
        type: { enum: [possession_end, pass, paint_touch, assist, offensive_rebound, defensive_rebound, opposition_rebound, opposition_miss, steal, block, shot_made, shot_miss, turnover, foul, opp_score] }
        clock: { $ref: '#/components/schemas/Clock' }
        points: { type: integer, minimum: 1, maximum: 3 }
        note: { type: string, maxLength: 2000 }
    Provenance:
      type: object
      additionalProperties: false
      required: [sessionId, actorUserId, revision, timestamp]
      properties:
        sessionId: { $ref: '#/components/schemas/Id' }
        actorUserId: { type: string, minLength: 1, maxLength: 256 }
        revision: { type: integer, minimum: 1 }
        timestamp: { type: string, format: date-time }
    AuthoritativeEvent:
      type: object
      additionalProperties: false
      required: [id, playerId, type, clock, provenance]
      properties:
        <<: *eventDraftProperties
        lineupStintId: { $ref: '#/components/schemas/Id' }
        assist: { $ref: '#/components/schemas/ScoreAssist' }
        linkedScoreId: { $ref: '#/components/schemas/Id' }
        provenance: { $ref: '#/components/schemas/Provenance' }
        updatedProvenance: { $ref: '#/components/schemas/Provenance' }
    PossessionDetails:
      type: object
      additionalProperties: false
      properties:
        passCount: { type: [integer, 'null'], minimum: 0, maximum: 1000 }
        paintTouch: { type: [boolean, 'null'] }
        fastBreak: { type: [boolean, 'null'] }
    Possession:
      type: object
      additionalProperties: false
      required: [id, quarter, startClock, endClock, lineupIds, events, pointsFor, pointsAgainst]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        quarter: { type: integer, minimum: 1, maximum: 20 }
        startClock: { $ref: '#/components/schemas/Clock' }
        endClock: { $ref: '#/components/schemas/Clock' }
        lineupIds: { $ref: '#/components/schemas/Lineup' }
        events: { type: array, maxItems: 5000, items: { $ref: '#/components/schemas/AuthoritativeEvent' } }
        pointsFor: { type: integer, minimum: 0, maximum: 15000 }
        pointsAgainst: { type: integer, minimum: 0, maximum: 15000 }
        passCount: { type: [integer, 'null'], minimum: 0, maximum: 1000 }
        hadPaintTouch: { type: [boolean, 'null'] }
        wasFastBreak: { type: [boolean, 'null'] }
        side: { enum: [offense, defense] }
        completed: { type: boolean }
        detailsEdited: { type: boolean }
    SessionMetadata:
      type: object
      additionalProperties: false
      required: [id, gameId, competitionId, masterUserId, revision, status, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        gameId: { $ref: '#/components/schemas/Id' }
        competitionId: { $ref: '#/components/schemas/Id' }
        masterUserId: { type: string, minLength: 1, maxLength: 256 }
        revision: { type: integer, minimum: 0 }
        status: { enum: [setup, active, archived], description: Archived session status reserved; no session archive endpoint yet. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LoadedSession:
      type: object
      additionalProperties: false
      required: [session, state]
      properties:
        session: { $ref: '#/components/schemas/SessionMetadata' }
        state: { $ref: '#/components/schemas/SessionState' }
    OperationInput:
      oneOf:
        - type: object
          additionalProperties: false
          required: &operationRequired [operationId, expectedRevision, type, payload]
          properties:
            operationId: &operationId { type: string, format: uuid }
            expectedRevision: &expectedRevision { type: integer, minimum: 0, maximum: 9007199254740990 }
            type: { const: event.add }
            payload:
              type: object
              additionalProperties: false
              required: [possessionId, event]
              properties:
                possessionId: { $ref: '#/components/schemas/Id' }
                event: { $ref: '#/components/schemas/EventDraft' }
        - type: object
          additionalProperties: false
          required: *operationRequired
          properties:
            operationId: *operationId
            expectedRevision: *expectedRevision
            type: { const: event.delete }
            payload:
              type: object
              additionalProperties: false
              required: [possessionId, eventId]
              properties:
                possessionId: { $ref: '#/components/schemas/Id' }
                eventId: { $ref: '#/components/schemas/Id' }
        - type: object
          additionalProperties: false
          required: *operationRequired
          properties:
            operationId: *operationId
            expectedRevision: *expectedRevision
            type: { const: score.assist }
            payload:
              type: object
              additionalProperties: false
              required: [possessionId, scoreId, assist, assistEventId]
              properties:
                possessionId: { $ref: '#/components/schemas/Id' }
                scoreId: { $ref: '#/components/schemas/Id' }
                assist: { $ref: '#/components/schemas/ScoreAssist' }
                assistEventId: { $ref: '#/components/schemas/Id' }
        - type: object
